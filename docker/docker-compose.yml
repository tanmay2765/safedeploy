
services:
  postgres:
    image: postgres:16-alpine
    container_name: safedeploy-postgres
    restart: always

    environment:
      POSTGRES_USER: safedeploy_user
      POSTGRES_PASSWORD: safedeploy_password
      POSTGRES_DB: safedeploy_db

    ports:
      - "5432:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro

    security_opt:
      - no-new-privileges:true

    read_only: true

    tmpfs:
      - /tmp
      - /var/run/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safedeploy_user -d safedeploy_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    external: true
    name: safedeploy_postgres_data
