version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: safedeploy-postgres
    restart: always
    environment:
      POSTGRES_USER: safedeploy_user
      POSTGRES_PASSWORD: safedeploy_password
      POSTGRES_DB: safedeploy_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safedeploy_user -d safedeploy_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local

