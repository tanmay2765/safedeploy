
apiVersion: apps/v1
kind: Deployment
metadata:
  name: safedeploy-frontend
  namespace: safedeploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: safedeploy-frontend
  template:
    metadata:
      labels:
        app: safedeploy-frontend
    spec:
      imagePullSecrets:
        - name: ecr-registry
      containers:
        - name: frontend
          image: 309615786913.dkr.ecr.us-east-1.amazonaws.com/safedeploy-frontend:16
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: safedeploy-frontend
  namespace: safedeploy
spec:
  selector:
    app: safedeploy-frontend
  ports:
    - port: 3000
      targetPort: 3000
  type: NodePort
