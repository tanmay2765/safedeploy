
apiVersion: apps/v1
kind: Deployment
metadata:
  name: safedeploy-backend
  namespace: safedeploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: safedeploy-backend
  template:
    metadata:
      labels:
        app: safedeploy-backend
    spec:
      imagePullSecrets:
        - name: ecr-registry
      containers:
        - name: backend
          image: 309615786913.dkr.ecr.us-east-1.amazonaws.com/safedeploy-backend:14
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: POSTGRES_SERVER
              value: postgres
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB
            - name: ENVIRONMENT
              value: production
            - name: DEBUG
              value: "false"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: safedeploy-backend
  namespace: safedeploy
spec:
  selector:
    app: safedeploy-backend
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
